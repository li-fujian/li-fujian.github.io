name: Update verified Meituan dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sync-meituan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test validation and page calculations
        run: |
          python -m unittest discover -s meituan/tests -p "test_*.py"
          node --test meituan/tests/page.test.cjs
      - name: Fetch, cross-check, and rebuild
        run: python meituan/scripts/update_dashboard.py
      - name: Commit verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meituan/data/dashboard.json meituan/data/dashboard.js meituan/data/raw/
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update verified Meituan market data"
          git pull --rebase origin main
          git push
