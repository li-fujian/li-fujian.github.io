name: Update KC50 weekly dashboard

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when scheduled workflows are more likely to queue.
    - cron: "37 8 * * 5"
    - cron: "37 8 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch index data and rebuild the strategy
        run: python kc50-weekly/scripts/build_strategy.py

      - name: Assemble the Pages artifact
        run: |
          cp kc50-weekly/public/data/dashboard.json kc50-weekly/dashboard.json
          mkdir _site
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="_site" \
            --exclude="kc50-weekly/scripts" \
            --exclude="kc50-weekly/data" \
            --exclude="kc50-weekly/public" \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
