name: Update KC50 weekly dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-kc50-weekly.yml"
      - "kc50-weekly/app.js"
      - "kc50-weekly/scripts/**"
  schedule:
    - cron: "37 8 * * 5"
    - cron: "37 8 * * 1"

permissions:
  contents: write

concurrency:
  group: update-kc50-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch index data and rebuild the strategy
        run: python kc50-weekly/scripts/build_strategy.py

      - name: Sync dashboard.json into the site tree
        run: cp kc50-weekly/public/data/dashboard.json kc50-weekly/dashboard.json

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kc50-weekly/dashboard.json
          if git diff --staged --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "Update KC50 weekly dashboard data"
          git pull --rebase origin main
          git push
